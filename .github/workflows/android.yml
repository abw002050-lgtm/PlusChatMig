name: Extract Project Files Automatically

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip -o ChatMigModern_V27_FIXED.zip -d . || unzip -o ChatMigModern_V27_GitHub-1.zip -d .
        rm -f ChatMigModern_V27_FIXED.zip ChatMigModern_V27_GitHub-1.zip

    - name: Commit and Push Clean Files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Unzip project files into root directory" || echo "No changes to commit"
        git push
