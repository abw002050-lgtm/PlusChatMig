name: Android Build

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract ZIP File via Python
      run: |
        python3 -c "
        import zipfile, os, glob
        zip_files = glob.glob('*.zip') + glob.glob('*/*.zip')
        if zip_files:
            print(f'Found zip: {zip_files[0]}')
            with zipfile.ZipFile(zip_files[0], 'r') as zip_ref:
                zip_ref.extractall('.')
            print('Successfully extracted all files!')
        else:
            print('No zip file found, assuming repository is already unzipped.')
        "

    - name: Locate Project & Grant Permissions
      run: |
        GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found after extraction!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        chmod +x "$GRADLEW_PATH"
        echo "Project path: $PROJECT_DIR"

    - name: Build Debug APK
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
