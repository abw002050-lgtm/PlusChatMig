name: Android Build - ChatMigModern V27

on:
  push:
    branches:
      - main
      - master
      - رئيسي
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o ChatMigModern_V27_GitHub-1.zip -d .

      - name: Verify Android Project
        run: |
          echo "=== Project Root ==="
          pwd

          echo "=== Root Files ==="
          ls -la

          echo "=== Gradle Files ==="
          ls -la settings.gradle.kts
          ls -la build.gradle.kts
          ls -la app/build.gradle.kts

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Gradle Wrapper
        run: |
          echo "=== Creating Gradle Wrapper ==="
          gradle wrapper --gradle-version 8.11.1

      - name: Verify Gradle Wrapper
        run: |
          echo "=== Wrapper Files ==="
          ls -la gradlew
          ls -la gradle/wrapper

      - name: Grant execute permission
        run: |
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "=== APK Files ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatMigModern-V27-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
