name: Android Build

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract ZIP & Locate Gradle Project
      run: |
        # البحث عن ملف gradlew أولاً
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)

        # إذا لم يتواجد gradlew، يتم فك الضغط بوضع الهادئ -q لتسريع العملية
        if [ -z "$GRADLEW_PATH" ]; then
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE silently..."
            unzip -q -o "$ZIP_FILE" -d extracted_project
            GRADLEW_PATH=$(find extracted_project -name gradlew | head -n 1)
          fi
        fi

        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        chmod +x "$GRADLEW_PATH"

    - name: Verify Gradle Executable
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ls -la gradlew

    - name: Build with Gradle
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
