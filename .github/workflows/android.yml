name: Android Build

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto Extract ZIP & Find Gradle Project
      run: |
        # البحث عن ملف gradlew في أي مكان بالمسار
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)

        # إذا لم يجد gradlew، يفحص وجود ملف ZIP ويفك ضغطه تلقائياً
        if [ -z "$GRADLEW_PATH" ]; then
          echo "gradlew not found. Searching for zip files..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d extracted_project
            GRADLEW_PATH=$(find extracted_project -name gradlew | head -n 1)
          fi
        fi

        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: Could not find gradlew or project zip file!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        chmod +x "$GRADLEW_PATH"
        echo "Project directory identified at: $PROJECT_DIR"

    - name: Setup Firebase Config (Optional)
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > "${{ env.PROJECT_DIR }}/app/google-services.json"
        fi

    - name: Build with Gradle
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
