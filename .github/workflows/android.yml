name: Android Build - ChatMigModern V27

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip -o ChatMigModern_V27_GitHub-1.zip -d .

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Locate Android Project
      run: |
        echo "=== Searching for Gradle project ==="

        find . -maxdepth 5 \
          \( -name "settings.gradle" -o \
             -name "settings.gradle.kts" -o \
             -name "build.gradle" -o \
             -name "build.gradle.kts" \) \
          -print

        echo "=== Searching for Gradle Wrapper ==="

        find . -maxdepth 6 -name "gradlew" -type f -print

    - name: Prepare Gradle Wrapper
      run: |
        GRADLEW=$(find . -name "gradlew" -type f -print -quit)

        if [ -n "$GRADLEW" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Existing Gradle Wrapper found:"
          echo "$GRADLEW"
        else
          PROJECT_DIR=$(dirname "$(find . \
            \( -name "settings.gradle" -o \
               -name "settings.gradle.kts" \) \
            -type f -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Could not locate Android Gradle project."
            echo "Project contents:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Gradle project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.11.1
        fi

        echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

    - name: Grant execute permission
      run: |
        chmod +x "$PROJECT_DIR/gradlew"

    - name: Build Debug APK
      run: |
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug --stacktrace

    - name: Locate APK
      run: |
        echo "=== APK files ==="
        find . -type f -name "*.apk" -print

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChatMigModern-V27-debug
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
