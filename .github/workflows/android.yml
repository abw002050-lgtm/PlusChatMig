name: Android Build - ChatMigModern

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project structure
        run: |
          echo "📁 محتويات الجذر:"
          ls -la
          echo ""
          echo "📁 محتويات مجلد app:"
          ls -la app/ || echo "لا يوجد مجلد app"
          echo ""
          echo "📄 ملفات Gradle:"
          ls -la *.gradle* 2>/dev/null || echo "لا توجد ملفات gradle"

      - name: Setup Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "✅ تم كتابة app/google-services.json من السر."
          elif [ -f "app/google-services.json" ]; then
            echo "✅ google-services.json موجود بالفعل في المستودع."
          else
            echo "::warning::لم يتم تعيين السر GOOGLE_SERVICES_JSON."
            echo "سيتم بناء APK لكن Firebase لن يعمل."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew 2>/dev/null || echo "لا يوجد gradlew - سنستخدم gradle مباشرة"

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            echo "استخدام gradlew..."
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            echo "استخدام gradle مباشرة..."
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatMigModern-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
