name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Locate, Grant Permissions, and Build APK
      run: |
        # البحث عن ملف gradlew أينما كان موقعه داخل المستودع
        GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "لم يتم العثور على ملف gradlew!"
          exit 1
        fi
        echo "تم العثور على ملف gradlew في المسار: $GRADLEW_PATH"
        chmod +x "$GRADLEW_PATH"
        
        # الانتقال إلى المجلد الذي يحتوي على gradlew وتشغيل البناء
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
