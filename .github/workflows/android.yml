name: Android Build

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ALL ZIP Files via Python
      run: |
        python3 -c "
        import zipfile, os, glob

        # البحث عن جميع ملفات الـ ZIP في أي مكان بالمستودع
        zip_files = glob.glob('**/*.zip', recursive=True) + glob.glob('*.zip')
        print(f'Found {len(zip_files)} zip file(s): {zip_files}')

        for z in zip_files:
            print(f'Extracting: {z}')
            try:
                with zipfile.ZipFile(z, 'r') as zip_ref:
                    zip_ref.extractall('.')
            except Exception as e:
                print(f'Failed to extract {z}: {e}')
        print('Extraction complete!')
        "

    - name: Locate Project & Grant Permissions
      run: |
        # البحث عن ملف gradlew في كل المجلدات الشجرة
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Listing all directories to debug structure:"
          ls -R
          echo "Error: gradlew file still not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        chmod +x "$GRADLEW_PATH"
        echo "Successfully found project at: $PROJECT_DIR"

    - name: Build Debug APK
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
